# ============================================================
# 智聘云 Docker Compose — 阶段式部署
# ============================================================
# 使用顺序:
#   1. ./01_prepare_env.sh
#   2. ./02_build_images.sh
#   3. ./03_recreate_stack.sh

services:
  frontend:
    image: ${FRONTEND_IMAGE}
    build:
      context: ..
      dockerfile: deploy/docker/frontend.Dockerfile
    ports:
      - "${EXPOSE_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - zhipin-net
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE}
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
    env_file:
      - ../backend/.env.production
    environment:
      - OPENCLAW_BASE_URL=http://openclaw:18789
      - OPENCLAW_MEDIA_MOUNT=/openclaw-home/.openclaw/media
      - CORS_ORIGINS=*
      - DEBUG=false
    volumes:
      - ../backend/openclaw:/openclaw-home:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      openclaw:
        condition: service_healthy
    networks:
      - zhipin-net
    restart: unless-stopped

  openclaw:
    image: ${OPENCLAW_RUNTIME_IMAGE}
    ports:
      - "${OPENCLAW_HOST_PORT:-28789}:18789"
      - "${OPENCLAW_HOST_PORT_BROWSER:-28791}:18791"
    environment:
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_AUTH_TOKEN}
      - TZ=${OPENCLAW_TZ:-Asia/Shanghai}
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      - SYS_ADMIN
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1.5
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:18789/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - ../backend/openclaw:/home/node
    networks:
      - zhipin-net
    restart: unless-stopped

networks:
  zhipin-net:
    driver: bridge
