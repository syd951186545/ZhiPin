# ============================================================
# 机灵平台 Docker Compose
# 使用方法：编辑 .env.production 后执行 ./deploy.sh
# ============================================================

services:
  frontend:
    image: ${FRONTEND_IMAGE}
    build:
      context: ..
      dockerfile: deploy/docker/frontend.Dockerfile
    ports:
      - "${EXPOSE_PORT:-80}:80"
    depends_on:
      backopenclaw:
        condition: service_healthy
    networks:
      - zhipin-net
    restart: unless-stopped

  backopenclaw:
    image: ${BACKOPENCLAW_IMAGE}
    build:
      context: ..
      dockerfile: deploy/docker/backopenclaw.Dockerfile
      args:
        OPENCLAW_BASE_IMAGE: ${OPENCLAW_IMAGE}
        PLAYWRIGHT_SKILL_REF: ${OPENCLAW_PLAYWRIGHT_SKILL_REF:-v4.1.0}
        APT_MIRROR_HOST: ${OPENCLAW_APT_MIRROR_HOST:-mirrors.tuna.tsinghua.edu.cn}
        NPM_REGISTRY: ${OPENCLAW_NPM_REGISTRY:-https://registry.npmmirror.com}
        PLAYWRIGHT_DOWNLOAD_HOST: ${OPENCLAW_PLAYWRIGHT_DOWNLOAD_HOST:-https://npmmirror.com/mirrors/playwright}
    environment:
      - TZ=${OPENCLAW_TZ:-Asia/Shanghai}
      - PLAYWRIGHT_DOWNLOAD_HOST=${OPENCLAW_PLAYWRIGHT_DOWNLOAD_HOST:-https://npmmirror.com/mirrors/playwright}
    volumes:
      - backopenclaw_data:/opt/openclaw-home
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      - SYS_ADMIN
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    ports:
      - "${LIVE_LOGIN_WS_PORT_START:-6800}:6800"
      - "${LIVE_LOGIN_WS_PORT_1:-6801}:6801"
      - "${LIVE_LOGIN_WS_PORT_2:-6802}:6802"
      - "${LIVE_LOGIN_WS_PORT_3:-6803}:6803"
      - "${LIVE_LOGIN_WS_PORT_4:-6804}:6804"
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; resp = urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5); data = json.load(resp); assert data.get('status') == 'ok'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - zhipin-net
    restart: unless-stopped

networks:
  zhipin-net:
    driver: bridge

volumes:
  backopenclaw_data:
