upstream backopenclaw {
    server backopenclaw:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # ---------- Frontend: React SPA static files ----------
    root /usr/share/nginx/html;
    index index.html;

    # ---------- API proxy → FastAPI backend ----------
    location /api/ {
        proxy_pass http://backopenclaw;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE support: disable buffering so events stream through immediately
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Match backend SSE_TIMEOUT (300s) + margin
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---------- SPA fallback: all non-file routes → index.html ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- Compression ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        image/svg+xml;
}
