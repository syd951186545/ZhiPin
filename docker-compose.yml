# ============================================================
# 智聘云 Docker Compose — 一键部署前端 + 后端 + OpenClaw
# ============================================================
#
# 使用方法:
#   1. cp .env.production.template .env.production  # 填入真实配置
#   2. docker compose up -d --build
#   3. 浏览器访问 http://<server-ip>
#
# 架构:
#   Browser → nginx(:80) ─┬─ /api/*  → backend(:8000) → OpenClaw(:18789)
#                          └─ /*      → React SPA (dist/)
#
#   OpenClaw 截图 → openclaw-media 共享卷 → backend 本地读取 → Supabase Storage
#

services:
  # ── Frontend: React SPA served by nginx (also acts as reverse proxy) ──
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    ports:
      - "${EXPOSE_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - zhipin-net
    restart: unless-stopped

  # ── Backend: Python FastAPI + LangGraph workflow engine ──
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - .env.production
    environment:
      # 在 Docker 网络中通过服务名访问 OpenClaw
      - OPENCLAW_BASE_URL=http://openclaw:18789
      - OPENCLAW_MEDIA_MOUNT=/openclaw-media
      - CORS_ORIGINS=*
      - DEBUG=false
    volumes:
      - openclaw-media:/openclaw-media:ro
    depends_on:
      openclaw:
        condition: service_healthy
    networks:
      - zhipin-net
    restart: unless-stopped

  # ── OpenClaw: Browser automation agent ──
  # 如果 OpenClaw 已在宿主机运行（非 Docker），注释掉此 service，
  # 并修改 backend 的 OPENCLAW_BASE_URL 和 volumes，详见 deploy.sh
  openclaw:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    ports:
      - "${OPENCLAW_HOST_PORT:-28789}:18789"   # HTTP API（宿主机端口可通过 env 覆盖）
      - "${OPENCLAW_HOST_PORT_BROWSER:-28791}:18791"   # Browser control
    environment:
      # OPENCLAW_GATEWAY_TOKEN 与 backend 的 OPENCLAW_AUTH_TOKEN 保持一致，避免认证不匹配
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_AUTH_TOKEN}
      - TZ=${OPENCLAW_TZ:-Asia/Shanghai}
    # ── 容器安全约束 ──────────────────────────────────────────────────────
    # 不启用 openclaw 原生沙箱（默认阻止 browser 工具），改用 Docker 层安全加固
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW      # Chromium 网络功能需要
      - SYS_ADMIN    # Chrome 内核 namespace 沙箱需要（比 --no-sandbox 更安全）
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    memswap_limit: 2g   # 等于 mem_limit = 禁用 swap
    cpus: 1.5
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:18789/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - openclaw-media:/home/node/.openclaw/media   # 官方镜像用户为 node，非 sunyd
    networks:
      - zhipin-net
    restart: unless-stopped

volumes:
  openclaw-media:
    driver: local

networks:
  zhipin-net:
    driver: bridge
