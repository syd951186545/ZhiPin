# ============================================================
# 智聘云 Docker Compose — 一键部署前端 + 后端 + OpenClaw
# ============================================================
#
# 使用方法:
#   1. cp .env.production.template .env.production  # 填入真实配置
#   2. docker compose up -d --build
#   3. 浏览器访问 http://<server-ip>
#
# 架构:
#   Browser → nginx(:80) ─┬─ /api/*  → backend(:8000) → OpenClaw(:18789)
#                          └─ /*      → React SPA (dist/)
#
#   OpenClaw 截图 → openclaw-media 共享卷 → backend 本地读取 → Supabase Storage
#

services:
  # ── Frontend: React SPA served by nginx (also acts as reverse proxy) ──
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    ports:
      - "${EXPOSE_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - zhipin-net
    restart: unless-stopped

  # ── Backend: Python FastAPI + LangGraph workflow engine ──
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - .env.production
    environment:
      # 在 Docker 网络中通过服务名访问 OpenClaw
      - OPENCLAW_BASE_URL=http://openclaw:18789
      - OPENCLAW_MEDIA_MOUNT=/openclaw-media
      - CORS_ORIGINS=*
      - DEBUG=false
    volumes:
      - openclaw-media:/openclaw-media:ro
    depends_on:
      openclaw:
        condition: service_started
    networks:
      - zhipin-net
    restart: unless-stopped

  # ── OpenClaw: Browser automation agent ──
  # 如果 OpenClaw 已在宿主机运行（非 Docker），注释掉此 service，
  # 并修改 backend 的 OPENCLAW_BASE_URL 和 volumes，详见 deploy.sh
  openclaw:
    image: ${OPENCLAW_IMAGE:-openclaw/openclaw:latest}
    ports:
      - "18789:18789"   # HTTP API
      - "18791:18791"   # Browser control
    volumes:
      - openclaw-media:/home/sunyd/.openclaw/media
    networks:
      - zhipin-net
    restart: unless-stopped

volumes:
  openclaw-media:
    driver: local

networks:
  zhipin-net:
    driver: bridge
